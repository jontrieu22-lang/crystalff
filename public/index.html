<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Crystal FF – Kalshi Picks</title>
<style>
  :root { --bg:#0f1420; --card:#181f30; --fg:#e8ecf5; --mut:#8b95ad; --acc:#5b8cff; --good:#2fbf71; --bad:#e5544b; }
  @media (prefers-color-scheme: light) { :root { --bg:#f4f6fb; --card:#fff; --fg:#141a2a; --mut:#5d6780; } }
  * { box-sizing:border-box } body { margin:0; font:15px/1.4 system-ui,sans-serif; background:var(--bg); color:var(--fg) }
  main { max-width:820px; margin:0 auto; padding:16px }
  h1 { font-size:22px } h2 { font-size:16px; margin:0 0 8px }
  .card { background:var(--card); border-radius:10px; padding:14px; margin:12px 0 }
  input,select,button { font:inherit; padding:8px 10px; border-radius:6px; border:1px solid #3a4462; background:transparent; color:var(--fg) }
  button { background:var(--acc); border:0; color:#fff; cursor:pointer } button.ghost { background:transparent; border:1px solid #3a4462; color:var(--mut) }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center } .row > input { flex:1; min-width:180px }
  table { width:100%; border-collapse:collapse } td,th { text-align:left; padding:6px 4px; border-bottom:1px solid #2a3350 }
  .good { color:var(--good) } .bad { color:var(--bad) } .mut { color:var(--mut); font-size:13px }
  .pill { padding:1px 8px; border-radius:99px; font-size:12px; font-weight:600; background:#2a3350 }
</style>
</head>
<body><main>
<h1>🔮 Crystal FF <span class="mut">— who monitors the situation best?</span></h1>
<div id="app"></div>
</main>
<script src="app.js" type="module"></script>
</body>
</html>
