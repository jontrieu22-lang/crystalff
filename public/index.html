<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Loser of the Week</title>
<meta name="description" content="Weekly group parlay. Add your leg from Kalshi before Sunday 9 AM PT.">
<meta property="og:title" content="Loser of the Week 🏈">
<meta property="og:description" content="Add your leg for this week's parlay before Sunday 9 AM PT.">
<meta name="theme-color" content="#0e1320">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏈</text></svg>">
<style>
  :root {
    --bg: #0e1320; --card: #171e2f; --line: #263047; --fg: #eef1f7; --mut: #8d97ae;
    --acc: #4f7dff; --good: #27b36a; --bad: #e0514a; --warn: #e5a13a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #f3f5fa; --card: #fff; --line: #e1e5ee; --fg: #151b2b; --mut: #5f6a82; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 16px/1.4 -apple-system, system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  main { max-width: 640px; margin: 0 auto; padding: 12px 16px 80px; }
  header { display: flex; align-items: center; gap: 8px; padding: 6px 0 10px; }
  header h1 { font-size: 19px; margin: 0; flex: 1; }
  .chip { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 14px; background: var(--card); color: var(--fg); }
  .tabs { display: flex; gap: 4px; background: var(--card); border-radius: 10px; padding: 4px; margin-bottom: 12px; }
  .tabs button { flex: 1; border: 0; background: none; color: var(--mut); padding: 8px; border-radius: 7px; font: inherit; font-size: 14px; font-weight: 600; }
  .tabs button.on { background: var(--acc); color: #fff; }
  .card { background: var(--card); border-radius: 12px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; align-items: center; gap: 8px; }
  .grow { flex: 1; min-width: 0; }
  .mut { color: var(--mut); font-size: 13px; }
  .big { font-size: 26px; font-weight: 700; }
  .weeknav { display: flex; align-items: center; justify-content: space-between; }
  .weeknav button { background: none; border: 0; color: var(--fg); font-size: 22px; padding: 4px 12px; }
  .leg { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-top: 1px solid var(--line); }
  .leg:first-of-type { border-top: 0; }
  .who { font-weight: 600; font-size: 14px; }
  .odds { font-variant-numeric: tabular-nums; font-weight: 700; }
  .st { width: 28px; text-align: center; font-size: 18px; }
  /* Live tracking */
  .meter { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; border-radius: 2px; }
  .good-t { color: var(--good); } .warn-t { color: var(--warn); } .bad-t { color: var(--bad); }
  .live-dot { color: var(--bad); font-weight: 700; font-size: 12px; }
  .card.test { border: 1px dashed var(--warn); }
  .card.test .side { min-width: 64px; }
  .leg.sweat { box-shadow: inset 3px 0 0 var(--bad); padding-left: 8px; }
  .btn { display: block; width: 100%; border: 0; border-radius: 10px; padding: 14px; font: inherit; font-weight: 700; background: var(--acc); color: #fff; }
  .btn.ghost { background: none; border: 1px solid var(--line); color: var(--fg); font-weight: 500; }
  .banner { border-radius: 10px; padding: 10px 12px; margin-bottom: 12px; font-weight: 600; }
  .banner.bad { background: color-mix(in srgb, var(--bad) 18%, transparent); }
  .banner.good { background: color-mix(in srgb, var(--good) 18%, transparent); }
  .banner.warn { background: color-mix(in srgb, var(--warn) 18%, transparent); }
  input, select { width: 100%; font: inherit; padding: 10px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { text-align: right; padding: 8px 4px; border-bottom: 1px solid var(--line); }
  th:nth-child(-n+2), td:nth-child(-n+2) { text-align: left; }
  th { color: var(--mut); font-weight: 500; font-size: 12px; }
  /* Pick sheet */
  .sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 10; }
  /* Pinned header stays above the list; nothing below may create a layer that paints over it. */
  .sheet-head { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: 12px 16px 10px; max-width: 640px; margin: 0 auto; box-shadow: 0 1px 0 var(--line), 0 8px 12px -10px rgba(0,0,0,.35); }
  .sheet-body { max-width: 640px; margin: 0 auto; padding: 8px 16px 60px; }
  details.game { background: var(--card); border-radius: 12px; margin: 10px 0; }
  details.game > summary { padding: 14px; font-weight: 700; list-style: none; cursor: pointer; }
  details.game > summary::after { content: '▾'; float: right; color: var(--mut); }
  .group { padding: 0 14px 10px; }
  .group h4 { margin: 8px 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--mut); }
  .mkt { display: flex; align-items: center; gap: 6px; padding: 6px 0; border-top: 1px solid var(--line); }
  .side { min-width: 82px; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 8px; padding: 7px 6px; font: inherit; font-size: 13px; }
  .side b { display: block; font-size: 15px; }
  .side:disabled { color: var(--mut); background: transparent; border-style: dashed; text-decoration: line-through; }
  .side.mine { border-color: var(--acc); background: var(--acc); color: #fff; }
  select.line { width: auto; display: inline; padding: 2px 4px; margin: 0 2px; font-weight: 700; border-radius: 6px; border-color: var(--acc); }
  .odds-bar { display: flex; align-items: center; gap: 6px; margin-top: 8px; }
  .odds-bar input { width: 72px; padding: 6px; text-align: center; font-size: 15px; }
  .help { margin: 4px 0 2px; }
  .presets { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; scrollbar-width: none; }
  .presets::-webkit-scrollbar { display: none; }
  .presets .chip { white-space: nowrap; font-size: 13px; }
  .chip.on { background: var(--acc); border-color: var(--acc); color: #fff; }
  .side.dim { color: var(--mut); background: transparent; }
  .taken { font-size: 12px; color: var(--warn); }
  .names { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .names button { padding: 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--card); color: var(--fg); font: inherit; font-weight: 600; }
  .toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-weight: 600; z-index: 20; max-width: 90vw; }
  pre { white-space: pre-wrap; font: inherit; margin: 0; }
</style>
</head>
<body>
<main id="app"><p class="mut">Loading…</p></main>
<script type="module" src="app.js"></script>
</body>
</html>
